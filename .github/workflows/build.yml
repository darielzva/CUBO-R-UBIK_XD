name: Build iOS app

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    concurrency:
      group: raki-ios-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Si el submodulo es un repo privado, descomenta y crea el secret PAT_TOKEN:
          # token: ${{ secrets.PAT_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Debug estructura
        run: |
          pwd
          ls -la
          ls -la ThreeOneOSFive
          git submodule status || true
          which cargo rustup
          cargo --version
          head -c 300 ThreeOneOSFive/build-airlift-ffi.sh | cat -A | head -5

      - name: Rebuild Airlift FFI
        run: |
          # Quitar finales de linea de Windows (CRLF) por si el script se edito en Windows
          sed -i '' 's/\r$//' ThreeOneOSFive/build-airlift-ffi.sh
          bash ThreeOneOSFive/build-airlift-ffi.sh

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project ThreeOneOSFive.xcodeproj
          -target SupportPatch
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug
          CONFIGURATION_BUILD_DIR=$GITHUB_WORKSPACE/build-simulator/Build/Products/Debug-iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Raki-ios-simulator
          path: build-simulator/Build/Products/Debug-iphonesimulator/Raki.app
          if-no-files-found: error

      - name: Build for iOS Device (unsigned IPA)
        run: >-
          xcodebuild
          -project ThreeOneOSFive.xcodeproj
          -target SupportPatch
          -sdk iphoneos
          -configuration Release
          CONFIGURATION_BUILD_DIR=$GITHUB_WORKSPACE/build-device/Build/Products/Release-iphoneos
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Create unsigned IPA
        run: |
          ls -la build-device/Build/Products/Release-iphoneos/
          mkdir -p Payload
          cp -r build-device/Build/Products/Release-iphoneos/Raki.app Payload/
          zip -qr Raki-unsigned.ipa Payload/
          rm -rf Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Raki-unsigned-ipa
          path: Raki-unsigned.ipa
          if-no-files-found: error
